<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0-18 歲國家養｜我家可以領多少？</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --ink: #2E3A47;
    --ink-soft: #6B7785;
    --ink-light: #A0AAB5;
    --primary: #6B95B8;
    --primary-soft: #E8EFF5;
    --accent: #C8B89E;
    --accent-soft: #F5F0E8;
    --line: #E8EBEE;
  }
  
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    padding: 20px 16px;
    -webkit-font-smoothing: antialiased;
  }
  
  .wrapper {
    max-width: 520px;
    margin: 0 auto;
  }
  
  .header {
    text-align: center;
    padding: 8px 0 28px;
  }
  
  .badge {
    display: inline-block;
    color: var(--primary);
    background: var(--primary-soft);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
  }
  
  .title {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  
  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 400;
  }
  
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 16px;
  }
  
  .section-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--ink);
  }
  
  .section-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  
  .child-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
  }
  
  .child-label {
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    flex-shrink: 0;
    min-width: 50px;
  }
  
  .age-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-end;
  }
  
  .age-input {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    background: white;
    text-align: center;
    width: 64px;
    color: var(--ink);
    transition: border-color 0.15s;
  }
  
  .age-input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  
  .age-unit {
    font-size: 13px;
    color: var(--ink-soft);
  }
  
  .remove-btn {
    background: transparent;
    border: none;
    color: var(--ink-light);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    border-radius: 4px;
    transition: color 0.15s;
  }
  
  .remove-btn:hover {
    color: var(--primary);
  }
  
  .add-btn {
    width: 100%;
    border: 1px dashed var(--ink-light);
    background: transparent;
    color: var(--ink-soft);
    padding: 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
    font-family: inherit;
    transition: all 0.15s;
  }
  
  .add-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-soft);
  }
  
  .add-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  
  .result-box {
    margin-top: 22px;
    background: linear-gradient(180deg, var(--primary-soft) 0%, white 100%);
    border: 1px solid var(--primary);
    border-radius: 14px;
    padding: 22px 20px;
  }
  
  .result-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  
  .result-main {
    font-size: 38px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 8px;
    letter-spacing: -1.5px;
    color: var(--ink);
  }
  
  .result-main .unit {
    font-size: 16px;
    font-weight: 600;
    margin-left: 4px;
    color: var(--ink-soft);
  }
  
  .result-detail {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  
  .result-extra {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  
  .result-extra-item .ex-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }
  
  .result-extra-item .ex-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.3px;
  }
  
  .result-extra-item .ex-value .small {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-left: 2px;
  }
  
  .total-banner {
    margin-top: 16px;
    padding: 14px 16px;
    background: white;
    border: 1px solid var(--accent);
    border-radius: 10px;
    text-align: center;
  }
  
  .total-banner .tb-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }
  
  .total-banner .tb-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.5px;
  }
  
  .total-banner .tb-value .small {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-left: 2px;
  }
  
  .note {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 10px;
    line-height: 1.7;
  }
  
  .note strong {
    color: var(--ink);
  }
  
  .footnote {
    margin-top: 12px;
    padding: 0 4px;
    font-size: 11px;
    color: var(--ink-light);
    line-height: 1.75;
  }
  
  .footnote strong {
    color: var(--ink-soft);
    font-weight: 600;
  }
  
  .footer {
    text-align: center;
    padding: 16px 16px 4px;
    font-size: 11px;
    color: var(--ink-light);
    line-height: 1.7;
  }
  
  .footer strong {
    color: var(--ink-soft);
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .fade-in {
    animation: fadeIn 0.2s ease-out;
  }
  
  @media (max-width: 420px) {
    .title { font-size: 24px; }
    .result-main { font-size: 32px; }
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <div class="header">
    <div class="badge">2027 上路</div>
    <h1 class="title">0-18 歲國家養<br>我家可以領多少？</h1>
    <p class="subtitle">輸入孩子年齡，30 秒看懂</p>
  </div>

  <div class="card">
    <h2 class="section-title">家裡有幾位寶貝？</h2>
    <p class="section-sub">最多 3 位 ‧ 年齡 0-17 歲（滿 18 即不再發放）</p>
    
    <div id="children-list"></div>
    
    <button class="add-btn" id="add-child-btn">＋ 再加一位孩子</button>

      <div class="result-detail" id="cash-breakdown">請輸入孩子年齡開始試算</div>
